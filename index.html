// 愛犬写真を圧縮して送信用データに変換
function compressDogPhoto(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();

    reader.onload = function(event) {
      const image = new Image();

      image.onload = function() {
        const canvas = document.createElement("canvas");
        const maxSize = 800;

        let width = image.width;
        let height = image.height;

        if (width > height && width > maxSize) {
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else if (height >= width && height > maxSize) {
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }

        canvas.width = width;
        canvas.height = height;

        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0, width, height);

        resolve(canvas.toDataURL("image/jpeg", 0.7));
      };

      image.onerror = reject;
      image.src = event.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// 選択された愛犬IDを取得
function getSelectedDogIds(action) {
  return Array.from(
    document.querySelectorAll('#myDogsList input[type="checkbox"]:checked')
  )
  .filter(function(item) {
    const isCheckedIn = item.dataset.checkedIn === "true";

    if (action === "checkIn") {
      return !isCheckedIn;
    }

    if (action === "checkOut") {
      return isCheckedIn;
    }

    return false;
  })
  .map(function(item) {
    return item.value;
  });
}

    return;

// GASへチェックイン・チェックアウトを送信
async function sendVisitAction(action, dogIds) {
  const message = document.getElementById("visitMessage");
  const checkInButton = document.getElementById("checkInButton");
  const checkOutButton = document.getElementById("checkOutButton");

  try {
    checkInButton.disabled = true;
    checkOutButton.disabled = true;
    message.textContent = "処理しています...";

    const response = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: action,
        accessToken: liff.getAccessToken(),
        dogIds: dogIds
      })
    });

    const result = await response.json();

    message.textContent = result.message;

    if (result.success) {
  await refreshMyDogs();
  await refreshPublicDogs();
}

  } catch (error) {
    message.textContent = "通信エラー：" + error.message;

  } finally {
    checkInButton.disabled = false;
    checkOutButton.disabled = false;
  }
}

  document.getElementById("age").value = dog.age || "";

  document.getElementById("playStyle").value = dog.playStyle || "";
  document.getElementById("profilePublic").value = dog.profilePublic || "公開";

  // 写真選択欄をリセット
  document.getElementById("dogPhoto").value = "";

  // 登録済みの写真を表示
  const preview = document.getElementById("dogPhotoPreview");
  preview.src = "";
  preview.style.display = "none";

  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "getDogPhoto",
        accessToken: liff.getAccessToken(),
        dogId: dog.dogId
      })
    });

    const result = await response.json();

    if (result.success && result.photoData) {
      preview.src = result.photoData;
      preview.style.display = "block";
    }
  } catch (error) {
    console.error("写真取得エラー:", error);
  }

  document.querySelector("#dogForm h2").textContent = "愛犬プロフィール編集";
  document.getElementById("registerDog").textContent = "変更を保存する";

  document.getElementById("visitSection").style.display = "none";
  document.getElementById("dogForm").style.display = "block";

  window.scrollTo(0, 0);
}
// 愛犬一覧を再読み込み
async function refreshMyDogs() {
  const response = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      action: "getMyDogs",
      accessToken: liff.getAccessToken()
    })
  });

  const result = await response.json();

  if (!result.success) {
    throw new Error(result.message);
  }

  const dogForm = document.getElementById("dogForm");
  const visitSection = document.getElementById("visitSection");
  const dogsList = document.getElementById("myDogsList");

  dogsList.innerHTML = "";

  if (result.dogs.length === 0) {
    dogForm.style.display = "block";
    visitSection.style.display = "none";
    dogsList.textContent = "登録済みの愛犬はいません。";
    return;
  }

  dogForm.style.display = "none";
  visitSection.style.display = "block";

  for (const dog of result.dogs) {
    const dogItem = document.createElement("div");

    const dogPhoto = document.createElement("img");
    dogPhoto.style.width = "100px";
    dogPhoto.style.height = "100px";
    dogPhoto.style.objectFit = "cover";
    dogPhoto.style.borderRadius = "12px";
    dogPhoto.style.display = "none";
    dogPhoto.style.marginBottom = "8px";

    dogItem.appendChild(dogPhoto);

    try {
      const photoResponse = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: "getDogPhoto",
          accessToken: liff.getAccessToken(),
          dogId: dog.dogId
        })
      });

      const photoResult = await photoResponse.json();

      if (photoResult.success && photoResult.photoData) {
        dogPhoto.src = photoResult.photoData;
        dogPhoto.style.display = "block";
      }
    } catch (error) {
      console.error("写真取得エラー:", error);
    }

    const label = document.createElement("label");
    const checkbox = document.createElement("input");

    checkbox.type = "checkbox";
    checkbox.value = dog.dogId;
    checkbox.dataset.checkedIn = dog.isCheckedIn ? "true" : "false";

    label.appendChild(checkbox);
    label.appendChild(
      document.createTextNode(
        " " + dog.dogName + "（" + dog.breed + "）" +
        (dog.isCheckedIn ? "【来場中】" : "【未チェックイン】")
      )
    );

        dogItem.appendChild(label);

    // プロフィール編集ボタン
    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.textContent = "プロフィール編集";
    editButton.style.display = "block";
    editButton.style.marginTop = "10px";
    editButton.style.marginBottom = "20px";

    editButton.addEventListener("click", function() {
      editDogProfile(dog);
    });

    dogItem.appendChild(editButton);
    dogsList.appendChild(dogItem);
  }
}
// 現在来場中の公開わんちゃん一覧を取得
async function refreshPublicDogs() {
  const dogsList = document.getElementById("publicDogsList");

  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "getPublicDogs",
        accessToken: liff.getAccessToken()
      })
    });

    const result = await response.json();

    if (!result.success) {
      throw new Error(result.message);
    }

    dogsList.innerHTML = "";

    if (result.dogs.length === 0) {
      dogsList.textContent = "現在、公開中の来場わんちゃんはいません。";
      return;
    }

    result.dogs.forEach(function(dog) {
      const dogItem = document.createElement("div");

      dogItem.style.padding = "12px";
      dogItem.style.marginBottom = "10px";
      dogItem.style.background = "#f5f5f5";
      dogItem.style.borderRadius = "10px";

      dogItem.textContent = "🐶 " + dog.dogName + "（" + dog.breed + "）";

      dogsList.appendChild(dogItem);
    });

  } catch (error) {
    console.error("公開わんちゃん一覧エラー:", error);
    dogsList.textContent = "わんちゃん一覧を取得できませんでした。";
  }
}

// 選択した愛犬写真をプレビュー表示
document.getElementById("dogPhoto").addEventListener("change", function() {
  const file = this.files[0];
  const preview = document.getElementById("dogPhotoPreview");

  if (!file) {
    preview.style.display = "none";
    preview.src = "";
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("画像ファイルを選択してください。");
    this.value = "";
    preview.style.display = "none";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    preview.src = event.target.result;
    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
});

    refreshPublicDogs();
