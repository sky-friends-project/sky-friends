<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY FRIENDS</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f8f5;
      color: #333;
      text-align: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
    }
    h1 { color: #56866a; }
    p { line-height: 1.8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>SKY FRIENDS</h1>
    <p>あの子に、また会える。</p>
    <p id="status">LINEに接続しています...</p>
  </div>

  <script>
    const LIFF_ID = "2012343834-v6IbIhDY";

    async function main() {
      const status = document.getElementById("status");

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログインが必要です。";
          return;
        }

        const accessToken = liff.getAccessToken();

if (!accessToken) {
  status.textContent = "LINE認証情報を取得できませんでした。";
  return;
}

status.textContent = "LINE認証を確認しています...";

const response = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({
    accessToken: accessToken
  })
});

const result = await response.json();

status.textContent = result.message;
      } catch (error) {
        status.textContent = "接続エラー：" + error.message;
      }
    }

    main();
  </script>
</body>
</html>
