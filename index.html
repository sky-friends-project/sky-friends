<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY FRIENDS</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f8f5;
      color: #333;
      text-align: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
    }
    h1 { color: #56866a; }
    p { line-height: 1.8; }
    label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  background: #fff;
}

#registerDog {
  #backToVisitButton,
#showDogFormButton {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #777;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #56866a;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
  </style>
</head>
<body>
  <div class="container">
    <h1>SKY FRIENDS</h1>
    <p>あの子に、また会える。</p>
    <p id="status">LINEに接続しています...</p>
    <div id="dogForm" style="display:none; text-align:left; margin-top:25px;">
  <h2>愛犬プロフィール登録</h2>

  <label>愛犬のお名前</label>
  <input id="dogName" type="text" placeholder="例：モコちゃん">

  <label>犬種</label>
  <input id="breed" type="text" placeholder="例：トイプードル">

  <label>年齢</label>
  <input id="age" type="number" placeholder="例：3">

  <label>体格</label>
  <select id="size">
    <option value="">選択してください</option>
    <option>小型犬</option>
    <option>中型犬</option>
    <option>大型犬</option>
  </select>

  <label>性格</label>
  <select id="personality">
    <option value="">選択してください</option>
    <option>おだやか</option>
    <option>活発</option>
    <option>慎重</option>
    <option>人懐っこい</option>
    <option>マイペース</option>
  </select>

  <label>好きな遊び方</label>
  <select id="playStyle">
    <option value="">選択してください</option>
    <option>他の犬と遊ぶ</option>
    <option>追いかけっこ</option>
    <option>飼い主と遊ぶ</option>
    <option>のんびり過ごす</option>
    <option>まだ練習中</option>
  </select>

  <label>プロフィール公開</label>
  <select id="profilePublic">
    <option value="公開">公開</option>
    <option value="非公開">非公開</option>
  </select>

  <button type="button" id="registerDog">登録する</button>
  <button type="button" id="backToVisitButton">来場受付に戻る</button>
</div>
<!-- 来場チェックイン -->
<div id="visitSection" style="display:none; margin-top:30px;">

  <h2>愛犬の来場受付</h2>

  <p>来場する愛犬を選択してください。</p>

  <div id="myDogsList"></div>
<button type="button" id="showDogFormButton">愛犬を追加登録</button>
  <button type="button" id="checkInButton">
    チェックイン
  </button>

  <button type="button" id="checkOutButton">
    チェックアウト
  </button>

  <p id="visitMessage"></p>

</div>
  </div>

  <script>
    const LIFF_ID = "2012343834-v6IbIhDY";

    async function main() {
      const status = document.getElementById("status");

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログインが必要です。";
          return;
        }

        const accessToken = liff.getAccessToken();

if (!accessToken) {
  status.textContent = "LINE認証情報を取得できませんでした。";
  return;
}

status.textContent = "LINE認証を確認しています...";

const response = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({
    accessToken: accessToken
  })
});

const result = await response.json();

status.textContent = result.message;

if (result.canRegister === true) {
  await refreshMyDogs();
}
      } catch (error) {
        status.textContent = "接続エラー：" + error.message;
      }
    }
document.getElementById("registerDog").addEventListener("click", async function() {
  const dogData = {
    action: "registerDog",
    accessToken: liff.getAccessToken(),
    dogName: document.getElementById("dogName").value.trim(),
    breed: document.getElementById("breed").value.trim(),
    age: document.getElementById("age").value.trim(),
    size: document.getElementById("size").value,
    personality: document.getElementById("personality").value,
    playStyle: document.getElementById("playStyle").value,
    profilePublic: document.getElementById("profilePublic").value
  };

  if (
    !dogData.dogName ||
    !dogData.breed ||
    !dogData.age ||
    !dogData.size ||
    !dogData.personality ||
    !dogData.playStyle
  ) {
    alert("すべての項目を入力してください。");
    return;
  }

  try {
    document.getElementById("registerDog").disabled = true;

    const response = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(dogData)
    });

   const result = await response.json();
alert(result.message);

if (result.success) {
  await refreshMyDogs();
}

  } catch (error) {
    alert("通信に失敗しました。もう一度お試しください。");

  } finally {
    document.getElementById("registerDog").disabled = false;
  }
});
// 選択された愛犬IDを取得
function getSelectedDogIds(action) {
  return Array.from(
    document.querySelectorAll('#myDogsList input[type="checkbox"]:checked')
  )
  .filter(function(item) {
    const isCheckedIn = item.dataset.checkedIn === "true";

    if (action === "checkIn") {
      return !isCheckedIn;
    }

    if (action === "checkOut") {
      return isCheckedIn;
    }

    return false;
  })
  .map(function(item) {
    return item.value;
  });
}
  
// チェックインボタン
document.getElementById("checkInButton").addEventListener("click", async function() {
  const dogIds = getSelectedDogIds("checkIn");

  if (dogIds.length === 0) {
    alert("チェックインできる愛犬を選択してください。");
    return;
  }

  await sendVisitAction("checkIn", dogIds);
});

// チェックアウトボタン
document.getElementById("checkOutButton").addEventListener("click", async function() {
  const dogIds = getSelectedDogIds("checkOut");

  if (dogIds.length === 0) {
    alert("チェックアウトできる愛犬を選択してください。");
    return;
  }

  await sendVisitAction("checkOut", dogIds);
});
    
// GASへチェックイン・チェックアウトを送信
async function sendVisitAction(action, dogIds) {
  const message = document.getElementById("visitMessage");
  const checkInButton = document.getElementById("checkInButton");
  const checkOutButton = document.getElementById("checkOutButton");

  try {
    checkInButton.disabled = true;
    checkOutButton.disabled = true;
    message.textContent = "処理しています...";

    const response = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: action,
        accessToken: liff.getAccessToken(),
        dogIds: dogIds
      })
    });

    const result = await response.json();

    message.textContent = result.message;

    if (result.success) {
      await refreshMyDogs();
    }

  } catch (error) {
    message.textContent = "通信エラー：" + error.message;

  } finally {
    checkInButton.disabled = false;
    checkOutButton.disabled = false;
  }
}
// 愛犬一覧を再読み込み
async function refreshMyDogs() {
  const response = await fetch("https://script.google.com/macros/s/AKfycbyOFcFofGr7TvXj9irk1kq7ME6qefRZb60xMT5d7afXvSqpvmvDZ1iTOb-qZB3UpKWJ/exec", {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      action: "getMyDogs",
      accessToken: liff.getAccessToken()
    })
  });

  const result = await response.json();

  if (!result.success) {
    throw new Error(result.message);
  }

  const dogForm = document.getElementById("dogForm");
const visitSection = document.getElementById("visitSection");

const dogsList = document.getElementById("myDogsList");
dogsList.innerHTML = "";

if (result.dogs.length === 0) {
  dogForm.style.display = "block";
  visitSection.style.display = "none";
  dogsList.textContent = "登録済みの愛犬はいません。";
  return;
}

dogForm.style.display = "none";
visitSection.style.display = "block";

  result.dogs.forEach(function(dog) {
    const dogItem = document.createElement("div");

    const label = document.createElement("label");
    const checkbox = document.createElement("input");

    checkbox.type = "checkbox";
    checkbox.value = dog.dogId;
    checkbox.dataset.checkedIn = dog.isCheckedIn ? "true" : "false";

    label.appendChild(checkbox);
    label.appendChild(
      document.createTextNode(
        " " + dog.dogName + "（" + dog.breed + "）" +
        (dog.isCheckedIn ? "【来場中】" : "【未チェックイン】")
      )
    );

    dogItem.appendChild(label);
    dogsList.appendChild(dogItem);
  });
}
// 愛犬の追加登録フォームを表示
document.getElementById("showDogFormButton").addEventListener("click", function() {
  document.getElementById("dogForm").style.display = "block";
  document.getElementById("visitSection").style.display = "none";
});
// 来場受付画面に戻る
document.getElementById("backToVisitButton").addEventListener("click", function() {
  document.getElementById("dogForm").style.display = "none";
  document.getElementById("visitSection").style.display = "block";
});
main();
</script>
